name: check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      # Report every matrix entry: a red Node 24 leg must not cancel the Node 22 one
      # (or vice versa) — the whole point of the matrix is to see both results.
      fail-fast: false
      matrix:
        # The floor the project promises (`engines: node >= 22`) and the current
        # release line. Both run the full step list below.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # No `npm install`: the engine, scripts and tests use Node builtins only and run
      # offline. The `web/` frontend's build-time devDependencies are assembled offline
      # inside the `docker` job (image `webbuild` stage) — never installed on this runner.
      - name: Tests
        run: node --test

      - name: Coverage gate
        # The line/branch/function floors are *not* restated here: they live once, in the
        # `test:coverage` script in package.json, and this step only invokes it — the same
        # script the container's verify-in-container.sh runs. A miss exits non-zero, so the
        # job goes red.
        run: npm run test:coverage

      - name: Skill sync is up to date
        run: node scripts/sync-skills.mjs --check

      - name: Manifests
        run: node scripts/verify/manifests.mjs

      - name: Version manifests agree
        run: node scripts/verify/version.mjs

      - name: Skill definition
        run: node scripts/verify/skill.mjs

      - name: Host runtime claim path (offline mock harness)
        # Drives the generated SessionStart hook / Codex claim trigger / wake scripts
        # against fake host CLIs and a canned shim, in a throwaway home. Runs with no
        # `claude`/`codex`/`pi` and no network — the runtime claim path is covered here
        # even though the real CLIs are absent (see scripts/verify/host-runtime.mjs).
        run: node scripts/verify/host-runtime.mjs

      - name: Shell script syntax
        run: bash -n install.sh scripts/install/*.sh scripts/verify/install-e2e.sh

  # Same image tag and same in-container command as `npm run verify:docker`, so a green
  # local run and a green CI run mean the same thing. This is the authoritative job: it is
  # the only place the frontend gets built — the `webbuild` stage resolves `web/`'s
  # build-time devDependencies from the committed offline cache (`npm ci --offline`), not
  # from the network.
  #
  # The install + first-run end-to-end is a step *inside* `docker/verify-in-container.sh`,
  # not a separate command here: when it lived only in this job, `npm run verify:docker`
  # could be green while this job was red.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build verification image
        run: docker build -f docker/Dockerfile -t meerkat-taskpanel:verify .

      - name: Run verification inside the container
        run: docker run --rm meerkat-taskpanel:verify bash docker/verify-in-container.sh
