name: check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No `npm install`: the scaffold has no dependencies and must run offline.
      - name: Tests
        run: node --test

      - name: Skill sync is up to date
        run: node scripts/sync-skills.mjs --check

      - name: Manifests
        run: node scripts/verify/manifests.mjs

      - name: Skill definition
        run: node scripts/verify/skill.mjs

      - name: Shell script syntax
        run: bash -n install.sh scripts/install/*.sh

  # Same image tag and same in-container command as `npm run verify:docker`, so a green
  # local run and a green CI run mean the same thing. No `npm install` here either.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build verification image
        run: docker build -f docker/Dockerfile -t task-panel:verify .

      - name: Run verification inside the container
        run: docker run --rm task-panel:verify bash docker/verify-in-container.sh
