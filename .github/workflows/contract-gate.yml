name: contract-gate

# The contract gates.
#
# `test/fixtures/contract/api.snapshot.json` freezes the surface a client binds
# to — routes, each route's declared request shape, error codes and wire fields.
# This job fails when the committed snapshot and the live surface disagree, so a
# route rename, an error-status change or a dropped wire field is caught at
# pull-request time instead of by a client after release.
#
# `test/fixtures/contract/cli.snapshot.json` is the CLI twin: every group,
# command, positional and flag, plus the success/error envelope keys. The loop
# and any script that spawns `taskctl --json` bind to that surface, not to the
# HTTP one.
#
# The second gate is the pairing half: `scripts/verify/route-request.mjs` proves
# each route's *declared* request schema equals what its handler actually reads
# (statically, from the handler source). The snapshot freezes the declaration;
# this proves the declaration is true — a handler that starts reading a field the
# declaration omits, or a declared filter nothing reads, fails here.
#
# It lives in its own workflow on purpose: `.github/workflows/check.yml` is owned
# by a concurrent change and must not be modified, the same reason
# `version-gate.yml` carries the changelog rule in a workflow of its own. Both
# checkers also run locally in `.githooks/pre-push` and `.githooks/pre-tag`.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: contract-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Offline: the checker imports the surface modules directly and is Node
      # builtins only — no `npm install`. It checks both that the snapshot still
      # describes the live API and that the file is in the canonical
      # (sorted-key, stable) form `--update` writes.
      - name: API contract matches the snapshot
        run: node scripts/verify/contract.mjs

      # The CLI surface the orchestrator (and user scripts) bind to.
      - name: CLI contract matches the snapshot
        run: node scripts/verify/cli-contract.mjs

      # The declaration the snapshot freezes must be the one the handler honours.
      # Static and offline, like the checker above: it reads handler source, opens
      # no database and starts no server.
      - name: Route request schema matches what the handler reads
        run: node scripts/verify/route-request.mjs
