name: signposts-gate

# The signpost gate.
#
# This repository interoperates with an external development framework that
# keeps its own task store in a private directory under the user's home. A
# document that names one of that framework's internals in a walkable form is an
# instruction to go there — and because this repository is greppable, a session
# reading it will follow. That is not hypothetical: a design contract that
# spelled the framework's card-writer path in order to declare the word
# forbidden became the signpost, and a session followed it out of the repository.
#
# `scripts/verify/signposts.mjs` fails the build on either shape: a home-relative
# path into that private store (the two subpaths a shipped feature legitimately
# integrates with are carved out inside the rule), or one of the framework's
# internal mechanism names.
#
# What the gate deliberately does **not** ban is the judgement call, and it is
# the larger half: framework names that name somebody else's thing, attributed
# and not used as our own, are kept — the project name, the interface-generation
# codename the loop declares, and the protocol anchors the SLA patrol publishes
# as a wire field and the test suite asserts. `design/contracts/naming-boundary.md`
# holds that reasoning; the checker's header states the part it enforces.
#
# The one exemption lives in `test/fixtures/framework-signposts-allowlist.json`,
# keyed by `{file, rule}` rather than by file — so that the contract which has to
# write the forbidden terms is not thereby also allowed to spell the store path.
# It is checked in both directions, so it can only shrink without a deliberate
# edit.
#
# It lives in its own workflow on purpose: `.github/workflows/check.yml` is owned
# by a concurrent change and must not be modified, the same reason
# `contract-gate.yml`, `version-gate.yml` and `paths-gate.yml` carry their rules
# in workflows of their own. The same check also runs locally in
# `.githooks/pre-push`, in `npm run verify`, and inside the container suite.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: signposts-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signposts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `setup-node`: the checker is Node builtins only and offline, and the
      # runner's Node is well past the `engines` floor. CI is the authoritative
      # place for this one: the container image drops `design/` (see
      # `.dockerignore`), so inside the container the gate sees a partial tree
      # and the design documents it exists to police are absent.
      - name: No tracked file carries a signpost out of the repository
        run: node scripts/verify/signposts.mjs
