<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="meerkat-taskpanel">
  <title>meerkat-taskpanel</title>
  <desc>Sentinel Watch — face candidate B «Snout · 吻». Three upright meerkats of a mob, left-low to right-high; the tallest stands on duty. Eyes and mouth are cut as negative-space knockout (light state), so the mark still restores to one colour and the outer silhouette is unchanged.</desc>
  <!--
       Face candidate B «Snout · 吻» — light. Frozen V2 geometry (five-parameter
       optical nudge) with the eyes + mouth cut as negative-space knockout. The mask
       greys are functional (luminance keep/knock-out), not brand colours.
  -->
  <defs>
    <mask id="face-knockout-b" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect x="0" y="0" width="32" height="32" fill="#FFFFFF"/>
      <g fill="#000000">
      <!-- sentinel 1 · face -->
      <circle cx="6.34" cy="19.88" r="0.5"/>
      <circle cx="8.06" cy="19.88" r="0.5"/>
      <rect x="6.54" y="20.68" width="1.32" height="0.88" rx="0.44"/>
      <!-- sentinel 2 · face -->
      <circle cx="15.14" cy="14.68" r="0.5"/>
      <circle cx="16.86" cy="14.68" r="0.5"/>
      <rect x="15.34" y="15.48" width="1.32" height="0.88" rx="0.44"/>
      <!-- sentinel 3 · face -->
      <circle cx="23.94" cy="11.88" r="0.5"/>
      <circle cx="25.66" cy="11.88" r="0.5"/>
      <rect x="24.14" y="12.68" width="1.32" height="0.88" rx="0.44"/>
      </g>
    </mask>
  </defs>
  <g mask="url(#face-knockout-b)">
    <!-- sentinel 1 · cx 7.2 · top 17.6 · h 9.4 · fill ink -->
    <g fill="#14181B">
      <rect x="4.6" y="17.6" width="5.2" height="9.4" rx="2.6"/>
      <circle cx="7.2" cy="20.2" r="2.6"/>
      <circle cx="4.8" cy="19.3" r="1.2"/>
      <circle cx="9.6" cy="19.3" r="1.2"/>
    </g>
    <!-- sentinel 2 · cx 16 · top 12.4 · h 14.6 · fill ink -->
    <g fill="#14181B">
      <rect x="13.4" y="12.4" width="5.2" height="14.6" rx="2.6"/>
      <circle cx="16" cy="15" r="2.6"/>
      <circle cx="13.6" cy="14.1" r="1.2"/>
      <circle cx="18.4" cy="14.1" r="1.2"/>
    </g>
    <!-- sentinel 3 · cx 24.8 · top 9.6 · h 17.4 · fill primary -->
    <g fill="#0F7A73">
      <rect x="22.2" y="9.6" width="5.2" height="17.4" rx="2.6"/>
      <circle cx="24.8" cy="12.2" r="2.6"/>
      <circle cx="22.4" cy="11.3" r="1.2"/>
      <circle cx="27.2" cy="11.3" r="1.2"/>
    </g>
  </g>
  <!-- watch signal — kept outside the mask, so the sentinel on duty stays solid -->
  <circle cx="24.8" cy="3.4" r="2.1" fill="#0F7A73"/>
</svg>
