<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="meerkat-taskpanel">
  <title>meerkat-taskpanel</title>
  <desc>Sentinel Watch — three upright meerkats of a mob, left-low to right-high. The tallest stands on duty; the ears hold shape from 48px up, and the watch signal floats clear of the crown at every size.</desc>
  <!--
       Sentinel Watch — monochrome. Every shape inherits `color` from the host
       element, so the mark restores on any ground (single-colour print, disabled
       states, build-time favicons).
  -->
    <!-- sentinel 1 · cx 7.2 · top 17.6 · h 9.4 -->
    <g fill="currentColor">
      <rect x="4.6" y="17.6" width="5.2" height="9.4" rx="2.6"/>
      <circle cx="7.2" cy="20.2" r="2.6"/>
      <circle cx="4.8" cy="19.3" r="1.2"/>
      <circle cx="9.6" cy="19.3" r="1.2"/>
    </g>
    <!-- sentinel 2 · cx 16 · top 12.4 · h 14.6 -->
    <g fill="currentColor">
      <rect x="13.4" y="12.4" width="5.2" height="14.6" rx="2.6"/>
      <circle cx="16" cy="15" r="2.6"/>
      <circle cx="13.6" cy="14.1" r="1.2"/>
      <circle cx="18.4" cy="14.1" r="1.2"/>
    </g>
    <!-- sentinel 3 · cx 24.8 · top 9.6 · h 17.4 -->
    <g fill="currentColor">
      <rect x="22.2" y="9.6" width="5.2" height="17.4" rx="2.6"/>
      <circle cx="24.8" cy="12.2" r="2.6"/>
      <circle cx="22.4" cy="11.3" r="1.2"/>
      <circle cx="27.2" cy="11.3" r="1.2"/>
    </g>
    <!-- watch signal — the sentinel on duty, clear of the head by 4.1 -->
    <circle cx="24.8" cy="3.4" r="2.1" fill="currentColor"/>
</svg>
