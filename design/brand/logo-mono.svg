<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="TaskPanel">
  <title>TaskPanel</title>
  <!-- Signal Bars — monochrome. Inherits `color` from the host element so the
       mark can sit on any surface (single-colour print, disabled states, favicons
       generated at build time). Geometry is fixed by brief.md §5. -->
  <rect x="5" y="17" width="6" height="10" rx="3" fill="currentColor"/>
  <rect x="13" y="12" width="6" height="15" rx="3" fill="currentColor"/>
  <rect x="21" y="10" width="6" height="17" rx="3" fill="currentColor"/>
  <circle cx="24" cy="6" r="2.75" fill="currentColor"/>
</svg>
