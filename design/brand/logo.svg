<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="meerkat-taskpanel">
  <title>meerkat-taskpanel</title>
  <desc>Sentinel Watch — three upright meerkats of a mob, left-low to right-high. The tallest stands on duty; the watch signal above it reads as a separate point, never a cap.</desc>
  <!--
       Sentinel Watch — light. Mob in ink, the sentinel on duty and its signal in
       the brand line. Transparent ground. Geometry fixed by brief.md §4.
  -->
    <!-- sentinel 1 · cx 7.2 · top 17.6 · h 9.4 -->
    <g fill="#14181B">
      <rect x="4.6" y="17.6" width="5.2" height="9.4" rx="2.6"/>
      <circle cx="7.2" cy="20.2" r="2.6"/>
      <circle cx="5.3" cy="18.6" r="0.85"/>
      <circle cx="9.1" cy="18.6" r="0.85"/>
    </g>
    <!-- sentinel 2 · cx 16 · top 12.4 · h 14.6 -->
    <g fill="#14181B">
      <rect x="13.4" y="12.4" width="5.2" height="14.6" rx="2.6"/>
      <circle cx="16" cy="15" r="2.6"/>
      <circle cx="14.1" cy="13.4" r="0.85"/>
      <circle cx="17.9" cy="13.4" r="0.85"/>
    </g>
    <!-- sentinel 3 · cx 24.8 · top 9.6 · h 17.4 -->
    <g fill="#0F7A73">
      <rect x="22.2" y="9.6" width="5.2" height="17.4" rx="2.6"/>
      <circle cx="24.8" cy="12.2" r="2.6"/>
      <circle cx="22.9" cy="10.6" r="0.85"/>
      <circle cx="26.7" cy="10.6" r="0.85"/>
    </g>
    <!-- watch signal — the sentinel on duty, clear of the head by 2.7 -->
    <circle cx="24.8" cy="5.2" r="1.7" fill="#0F7A73"/>
</svg>
