# Deploy smoke test for the `taskd` service.
#
# `command` runs the real daemon (`src/server/main.mjs`), so the healthcheck below
# exercises the product surface, not a liveness-only placeholder: `/health` is the
# SLO verdict the board itself publishes, and the same process serves the API and
# the built board from `web/dist`.
#
#   docker compose -f docker/docker-compose.yml up -d --build
#   docker compose -f docker/docker-compose.yml down -v
#
# Compose v2.4 compatible: no top-level `version:` key, no newer spec features.

services:
  taskd:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: meerkat-taskpanel:local
    environment:
      TASKD_HOST: 0.0.0.0
      TASKD_PORT: "9527"
      # The install root is baked into the image and is not a volume; point the
      # shared config at the data directory so an Access-panel save survives a
      # container recreate.
      MEERKAT_TASKPANEL_ENV_FILE: /app/.data/.env
    ports:
      - "9527:9527"
    volumes:
      - ../.data:/app/.data
    command: ["node","src/server/main.mjs"]
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:9527/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
