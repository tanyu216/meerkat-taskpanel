# Agent-kind profile: Cursor. See docs/docker.md § Profiles and docs/install.md.
actor_kind: cursor
label: Cursor
installer: scripts/install/cursor.sh
target_dir: .cursor/skills/meerkat-taskpanel
skill_entry: SKILL.md
wrapper: scripts/run.mjs
# Cursor's bundle is the repository root, like Claude's and Codex's: `.cursor-plugin/`
# carries the client marker, and OpenClaw's detector settles on cursor for that root
# (precedence codex → cursor → claude). Nothing is copied for it — the same `skills/`
# tree is read in place.
bundle: .
bundle_kind: bundle
bundle_format: cursor
