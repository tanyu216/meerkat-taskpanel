# Agent-kind profile: OpenClaw. See docs/agents/docker.md § Profiles and docs/ops/install.md.
actor_kind: openclaw
label: OpenClaw
installer: scripts/install/openclaw.sh
target_dir: .openclaw/skills/meerkat
skill_entry: SKILL.md
wrapper: scripts/run.mjs
# OpenClaw installs the repository-root bundle — the same `./` bundle Claude Code and Codex
# install. It carries no native manifest of its own: a native OpenClaw plugin is an
# in-process runtime module (package.json#openclaw.extensions + an entry point importing
# the OpenClaw SDK), a runtime dependency this project does not take. The detector reports
# the root as `bundle`/`claude`, the root carrying `.claude-plugin/` — see docs/ops/install.md.
bundle: .
bundle_kind: bundle
bundle_format: claude
