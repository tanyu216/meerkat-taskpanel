# Host profile: OpenClaw. See docs/docker.md § Profiles and docs/install.md.
host: openclaw
label: OpenClaw
installer: scripts/install/openclaw.sh
target_dir: .openclaw/skills/meerkat-taskpanel
skill_entry: SKILL.md
wrapper: scripts/run.mjs
# Root-level native manifest (openclaw.plugin.json), so OpenClaw's detector classifies
# this directory as a native plugin. A skill-only pack cannot be *installed* as a native
# plugin (that path needs package.json#openclaw.extensions + a runtime entry); OpenClaw
# installs the skill through the Claude bundle instead — see docs/install.md.
bundle: plugins/openclaw
bundle_kind: native
bundle_format: native
