# Host profile: OpenCode. See docs/docker.md § Profiles and docs/install.md.
host: opencode
label: OpenCode
installer: scripts/install/opencode.sh
target_dir: .config/opencode/skills/meerkat-taskpanel
skill_entry: SKILL.md
wrapper: scripts/run.mjs
# No bundle fields, deliberately. OpenCode's skills are registered by the plugin
# (`.opencode/plugins/meerkat-taskpanel.js`, run in-process) rather than by handing a
# bundle directory to a detector, so there is nothing here for the OpenClaw detector to
# classify — and no `~/.config/opencode/scheduling` either: its headless form is
# unverified, so no supervisor unit is wired for it (docs/scheduling.md).
