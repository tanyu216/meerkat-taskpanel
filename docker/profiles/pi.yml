# Host profile: Pi. See docs/docker.md § Profiles and docs/install.md.
host: pi
label: Pi
installer: scripts/install/pi.sh
target_dir: .agents/skills/meerkat-taskpanel
skill_entry: SKILL.md
wrapper: scripts/run.mjs
# Pi consumes the repository's own package.json — its `pi` field declares the skills
# directory and the extension in `.pi/extensions/`. Because the root also ships a
# skills/ tree, OpenClaw's detector classifies it as a manifestless Claude bundle.
bundle: .
bundle_kind: bundle
bundle_format: claude
