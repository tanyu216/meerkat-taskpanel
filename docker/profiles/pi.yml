# Agent-kind profile: Pi. See docs/docker.md § Profiles and docs/install.md.
actor_kind: pi
label: Pi
installer: scripts/install/pi.sh
target_dir: .agents/skills/meerkat-taskpanel
skill_entry: SKILL.md
wrapper: scripts/run.mjs
# Pi consumes the repository's own package.json — its `pi` field declares the skills
# directory and the extension in `.pi/extensions/`. OpenClaw's detector reports the
# repository root's format for it, which is cursor (see docker/profiles/claude.yml).
bundle: .
bundle_kind: bundle
bundle_format: cursor
