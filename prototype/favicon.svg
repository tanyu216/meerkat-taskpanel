<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="TaskPanel">
  <title>TaskPanel</title>
  <!-- Signal Bars — renders the BRAND.md §5 geometry (viewBox 0 0 32 32) as a
       favicon. The mark is fixed; only the two fills follow the browser colour
       scheme, so the tab strip stays legible on a light or a dark ground. -->
  <style>
    .bar {
      fill: #14181b;
    }
    .live {
      fill: #0f7a73;
    }
    @media (prefers-color-scheme: dark) {
      .bar {
        fill: #e6edf0;
      }
      .live {
        fill: #2aa79b;
      }
    }
  </style>
  <rect class="bar" x="5" y="17" width="6" height="10" rx="3" />
  <rect class="bar" x="13" y="12" width="6" height="15" rx="3" />
  <rect class="live" x="21" y="10" width="6" height="17" rx="3" />
  <circle class="live" cx="24" cy="6" r="2.75" />
</svg>
