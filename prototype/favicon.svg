<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="MeerkatTaskPanel">
  <title>MeerkatTaskPanel</title>
  <!-- Sentinel Watch — renders the BRAND.md §5 geometry (viewBox 0 0 32 32) as
       a favicon, the same reading as design/brand/favicon-32.png. The mark is
       fixed; only the two fills follow the browser colour scheme, so the tab
       strip stays legible on a light or a dark ground. The eyes and mouth are
       cut as negative space by the mask below (functional greys, not brand
       colours); the watch signal stays outside it and so is always solid. -->
  <style>
    .mob {
      fill: #14181b;
    }
    .sentinel {
      fill: #0f7a73;
    }
    @media (prefers-color-scheme: dark) {
      .mob {
        fill: #e6edf0;
      }
      .sentinel {
        fill: #2aa79b;
      }
    }
  </style>
  <defs>
    <mask id="face-knockout-a-favicon" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect x="0" y="0" width="32" height="32" fill="#FFFFFF" />
      <g fill="#000000">
        <!-- sentinel 1 · face -->
        <circle cx="6.4" cy="20" r="0.42" />
        <circle cx="8" cy="20" r="0.42" />
        <rect x="6.84" y="21.05" width="0.72" height="0.2" rx="0.1" />
        <!-- sentinel 2 · face -->
        <circle cx="15.2" cy="14.8" r="0.42" />
        <circle cx="16.8" cy="14.8" r="0.42" />
        <rect x="15.64" y="15.85" width="0.72" height="0.2" rx="0.1" />
        <!-- sentinel 3 · face -->
        <circle cx="24" cy="12" r="0.42" />
        <circle cx="25.6" cy="12" r="0.42" />
        <rect x="24.44" y="13.05" width="0.72" height="0.2" rx="0.1" />
      </g>
    </mask>
  </defs>
  <g mask="url(#face-knockout-a-favicon)">
    <!-- sentinel 1 · cx 7.2 · top 17.6 -->
    <g class="mob">
      <rect x="4.6" y="17.6" width="5.2" height="9.4" rx="2.6" />
      <circle cx="7.2" cy="20.2" r="2.6" />
      <circle cx="4.8" cy="19.3" r="1.2" />
      <circle cx="9.6" cy="19.3" r="1.2" />
    </g>
    <!-- sentinel 2 · cx 16 · top 12.4 -->
    <g class="mob">
      <rect x="13.4" y="12.4" width="5.2" height="14.6" rx="2.6" />
      <circle cx="16" cy="15" r="2.6" />
      <circle cx="13.6" cy="14.1" r="1.2" />
      <circle cx="18.4" cy="14.1" r="1.2" />
    </g>
    <!-- sentinel 3 (on duty, tallest) · cx 24.8 · top 9.6 -->
    <g class="sentinel">
      <rect x="22.2" y="9.6" width="5.2" height="17.4" rx="2.6" />
      <circle cx="24.8" cy="12.2" r="2.6" />
      <circle cx="22.4" cy="11.3" r="1.2" />
      <circle cx="27.2" cy="11.3" r="1.2" />
    </g>
  </g>
  <!-- watch signal — clear of the sentinel's crown by 4.1, outside the mask -->
  <circle class="sentinel" cx="24.8" cy="3.4" r="2.1" />
</svg>
